<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday ✦</title>
  <meta name="description" content="A little birthday surprise." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@400;500;600&family=Parisienne&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="grain"></div>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <main class="page">
    <nav class="nav">
      <span class="nav-mark">✦</span>
      <span>A little something for you</span>
      <span class="nav-date">08.27</span>
    </nav>

    <section class="hero">
      <p class="eyebrow">A very special day</p>
      <h1>Happy<br><span>Birthday</span></h1>
      <p class="subtitle">to someone who makes ordinary days<br class="desktop"> feel a little more extraordinary.</p>

      <button class="reveal-btn" id="revealBtn">
        <span>Open your surprise</span>
        <span class="arrow">↓</span>
      </button>
    </section>

    <section class="message" id="message">
      <div class="message-line"></div>
      <p class="small-label">A note for you</p>
      <p class="note">
        I hope this year brings you the kind of moments<br class="desktop">
        you remember long after they're over.
      </p>
      <p class="script">Here’s to you.</p>
      <div class="sparkles">✦ &nbsp; ✧ &nbsp; ✦</div>
    </section>

    <footer>
      <span>Made with a little love</span>
      <span>♡</span>
    </footer>
  </main>

  <canvas id="confetti"></canvas>
  <script src="script.js"></script>
</body>
</html>
